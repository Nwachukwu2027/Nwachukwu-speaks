<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administrator Login | NEW</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f5f8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    background: #071d3b;
    color: white;
    text-align: center;
    padding: 25px;
}

header h1 {
    font-size: 25px;
}

header p {
    color: #e5bd54;
}

.login-container {
    width: 90%;
    max-width: 430px;
    background: white;
    margin: auto;
    padding: 35px;
    border-radius: 10px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

.login-container h2 {
    color: #071d3b;
    text-align: center;
    margin-bottom: 10px;
}

.intro {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
    color: #071d3b;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 15px;
}

.password-wrapper {
    display: flex;
    gap: 7px;
}

.password-wrapper input {
    flex: 1;
    min-width: 0;
}

.password-wrapper button {
    padding: 0 12px;
    background: #e7edf5;
    color: #071d3b;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.login-button {
    width: 100%;
    padding: 14px;
    background: #071d3b;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.login-button:hover {
    background: #d6a832;
    color: #071d3b;
}

.login-button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

#message {
    display: none;
    padding: 12px;
    margin-bottom: 18px;
    border-radius: 5px;
    text-align: center;
    font-size: 14px;
}

.error {
    display: block !important;
    background: #ffe0e0;
    color: #9b1c1c;
}

.success {
    display: block !important;
    background: #d8f5df;
    color: #155724;
}

.back-home {
    display: block;
    text-align: center;
    margin-top: 22px;
    color: #071d3b;
    text-decoration: none;
}

footer {
    background: #06162c;
    color: white;
    text-align: center;
    padding: 20px;
    font-size: 13px;
}

</style>
</head>

<body>

<header>
    <h1>NWACHUKWU ELECTION WATCH</h1>
    <p>Administrator Access Portal</p>
</header>

<div class="login-container">

    <h2>Administrator Login</h2>

    <p class="intro">
        Sign in with your authorised administrator account.
    </p>

    <div id="message" role="status" aria-live="polite"></div>

    <form id="loginForm">

        <div class="form-group">
            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter administrator email"
                autocomplete="username"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

                <button type="button" id="togglePassword">
                    Show
                </button>

            </div>
        </div>

        <button
            type="submit"
            class="login-button"
            id="loginButton"
        >
            Sign In
        </button>

    </form>

    <a href="index.html" class="back-home">
        Return to Homepage
    </a>

</div>

<footer>
    <p>NWACHUKWU ELECTION WATCH (NEW)</p>
    <p>Transparency | Accountability | Credible Election Monitoring</p>
    <p>&copy; 2026 All Rights Reserved.</p>
</footer>

<script type="module">

import { supabase } from './supabase.js';

const loginForm = document.getElementById('loginForm');
const message = document.getElementById('message');
const loginButton = document.getElementById('loginButton');

function showMessage(text, type) {
    message.textContent = text;
    message.className = type;
    message.style.display = 'block';
}

// SHOW OR HIDE PASSWORD
document.getElementById('togglePassword')
.addEventListener('click', function() {

    const password = document.getElementById('password');

    if (password.type === 'password') {
        password.type = 'text';
        this.textContent = 'Hide';
    } else {
        password.type = 'password';
        this.textContent = 'Show';
    }

});

// ADMINISTRATOR LOGIN
loginForm.addEventListener('submit', async function(event) {

    event.preventDefault();

    loginButton.disabled = true;
    loginButton.textContent = 'Signing In...';

    message.style.display = 'none';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {

        const { data, error } = await supabase.auth.signInWithPassword({
            email,
            password
        });

        if (error) {
            throw error;
        }

        const user = data.user;

        // CHECK SECURE ADMIN ROLE
        if (user.app_metadata?.role !== 'admin') {

            await supabase.auth.signOut();

            throw new Error(
                'Access denied. This account is not authorised as an administrator.'
            );

        }

        showMessage('Login successful. Opening dashboard...', 'success');

        setTimeout(() => {
            window.location.href = 'admin.html';
        }, 1000);

    } catch (error) {

        console.error('Login error:', error);

        showMessage(
            error.message || 'Unable to sign in. Please try again.',
            'error'
        );

    } finally {

        loginButton.disabled = false;
        loginButton.textContent = 'Sign In';

    }

});

</script>

</body>
</html>
